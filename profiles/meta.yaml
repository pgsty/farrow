# Piglet-owned profile: meta
version: 1
name: meta
arch: native
network:
  mode: private
  cidr: 10.10.10.0/24
  host_address: 10.10.10.1
  dhcp_end: 10.10.10.8
defaults:
  image: u24
ssh:
  user: dba
nodes:
  - name: meta
    control: true
    host_aliases: [i.pigsty, api.pigsty, cli.pigsty, sss.pigsty, adm.pigsty, lab.pigsty, wiki.pigsty, git.pigsty]
    address: 10.10.10.10
    cpus: 2
    memory: 4GiB
    root_disk: 64GiB
    disks:
      - name: data
        size: 128GiB
        mount: /data
        filesystem: auto
        persistent: false
