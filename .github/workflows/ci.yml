name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Go 1.27 source gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          check-latest: false
          cache: true

      - name: Install pinned Staticcheck
        shell: bash
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.16.0
          install-only: true

      - name: Verify pinned source toolchain
        shell: bash
        run: |
          set -euo pipefail
          source packaging/toolchain.env
          test "$(go env GOVERSION)" = "go${FARROW_GO_VERSION}"
          test "$(staticcheck -version | awk '{print $2; exit}')" = "${FARROW_STATICCHECK_VERSION}"
          test "$(govulncheck -version | awk -F'@v' '/^Scanner:/ {print $2; exit}')" = "${FARROW_GOVULNCHECK_VERSION}"
          test "$(goreleaser --version | awk '/GitVersion:/ {sub(/^v/, "", $2); print $2; exit}')" = "${FARROW_GORELEASER_VERSION}"

      - name: Source hygiene and module integrity
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find cmd internal tools -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          git diff --check
          make module-check shell-check

      - name: Unit tests
        run: make test

      - name: Race tests
        run: make race

      - name: Vet
        run: make vet

      - name: Staticcheck
        run: make staticcheck

      - name: Reachable vulnerability scan
        run: make vuln

      - name: License inventory
        run: make license-check

      - name: Image pipeline simulated and offline boundaries
        run: make image-pipeline-test

      - name: Cross-build supported targets
        run: make cross-check

      - name: Validate GoReleaser configuration
        run: goreleaser check
