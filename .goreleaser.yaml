version: 2

project_name: farrow

builds:
  - id: farrow
    main: ./cmd/farrow
    binary: bin/farrow
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
      - -overlay=.goreleaser-companion/{{ .Os }}_{{ .Arch }}/overlay.json
    hooks:
      pre:
        - cmd: './packaging/goreleaser-companion.sh prepare "{{ .Os }}" "{{ .Arch }}" .goreleaser-companion'
          output: true
      post:
        - cmd: './packaging/goreleaser-companion.sh cleanup "{{ .Os }}" "{{ .Arch }}" .goreleaser-companion'
    ldflags:
      - >-
        -buildid= -s -w
        -X github.com/pgsty/farrow/internal/version.Version={{.Version}}
        -X github.com/pgsty/farrow/internal/version.Commit={{.FullCommit}}
        -X github.com/pgsty/farrow/internal/version.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: farrow-hosts-helper
    main: ./cmd/farrow-hosts-helper
    binary: bin/farrow-hosts-helper
    env:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=readonly
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -buildid= -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: farrow
    ids: [farrow, farrow-hosts-helper]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: &archive_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *archive_file_info
      - src: THIRD_PARTY_LICENSES.md
        info: *archive_file_info
      - src: packaging/pigsty/vm
        dst: bin/pigsty-vm
        info:
          owner: root
          group: root
          mode: 0755
          mtime: "{{ .CommitDate }}"
      - src: docs/architecture.md
        dst: docs/architecture.md
        info: *archive_file_info
      - src: docs/cli.md
        dst: docs/cli.md
        info: *archive_file_info
      - src: docs/config.md
        dst: docs/config.md
        info: *archive_file_info
      - src: docs/development.md
        dst: docs/development.md
        info: *archive_file_info
      - src: docs/images.md
        dst: docs/images.md
        info: *archive_file_info
      - src: docs/networking.md
        dst: docs/networking.md
        info: *archive_file_info
      - src: docs/phase-2.md
        dst: docs/phase-2.md
        info: *archive_file_info
      - src: docs/pigsty.md
        dst: docs/pigsty.md
        info: *archive_file_info
      - src: docs/security.md
        dst: docs/security.md
        info: *archive_file_info
      - src: docs/status.md
        dst: docs/status.md
        info: *archive_file_info
      - src: docs/troubleshooting.md
        dst: docs/troubleshooting.md
        info: *archive_file_info
      - src: tests/e2e/README.md
        dst: tests/e2e/README.md
        info: *archive_file_info
      - src: schemas/*
        dst: schemas
        info: *archive_file_info
      - src: third_party/licenses/*
        dst: third_party/licenses
        info: *archive_file_info

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive-spdx
    artifacts: archive
    cmd: ../packaging/goreleaser-sbom.sh
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - "${artifact}"
      - "${document}"
    env:
      - SOURCE_DATE_EPOCH={{ .Env.SOURCE_DATE_EPOCH }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: pgsty
    name: farrow
  draft: true
  prerelease: auto
