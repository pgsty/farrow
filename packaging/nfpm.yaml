name: farrow
arch: ${NFPM_ARCH}
platform: linux
version: ${FARROW_VERSION}
release: "1"
section: utils
priority: optional
maintainer: Pigsty <repo@pigsty.cc>
vendor: Pigsty
homepage: https://github.com/pgsty/farrow
license: Apache-2.0
description: |-
  Native Go/QEMU runtime for Pigsty development virtual machines.
  Farrow boots one Pigsty-compatible inventory as one fixed-IP deployment.

overrides:
  deb:
    depends:
      - ${FARROW_DEB_QEMU}
      - qemu-utils
      - ${FARROW_DEB_FIRMWARE}
      - openssh-client
      - iproute2
  rpm:
    depends:
      - qemu-kvm
      - qemu-img
      - ${FARROW_RPM_FIRMWARE}
      - openssh-clients
      - iproute

contents:
  - dst: /opt/farrow
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /opt/farrow/libexec
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /usr/share/doc/farrow
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - dst: /usr/share/doc/farrow/licenses
    type: dir
    packager: rpm
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${FARROW_PAYLOAD}/usr/bin/farrow
    dst: /usr/bin/farrow
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${FARROW_PAYLOAD}/opt/farrow/libexec/farrow-hosts-helper
    dst: /opt/farrow/libexec/farrow-hosts-helper
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0755
  - src: ${FARROW_PAYLOAD}/usr/share/doc/farrow/BUILD_INFO.json
    dst: /usr/share/doc/farrow/BUILD_INFO.json
    expand: true
    file_info:
      owner: root
      group: root
      mode: 0644
  - src: ${FARROW_PAYLOAD}/usr/share/doc/farrow/LICENSE
    expand: true
    dst: /usr/share/doc/farrow/LICENSE
  - src: ${FARROW_PAYLOAD}/usr/share/doc/farrow/README.md
    expand: true
    dst: /usr/share/doc/farrow/README.md
  - src: ${FARROW_PAYLOAD}/usr/share/doc/farrow/licenses/*
    expand: true
    dst: /usr/share/doc/farrow/licenses/

rpm:
  summary: Native Go/QEMU runtime for Pigsty development VMs

deb:
  fields:
    Bugs: https://github.com/pgsty/farrow/issues
